<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#101929" />
    <title>Бесконечные Острова</title>
    <meta name="description" content="Трёхмерное приключение среди парящих островов." />
  </head>
  <body>
    <div id="app">
      <canvas id="game" aria-label="Трёхмерная игровая сцена"></canvas>
      <div id="vignette"></div>
      <div id="ui"></div>
      <div id="touch" class="hidden">
        <div id="stick"><div id="nub"></div></div>
        <button id="touch-fire" aria-label="Стрелять">◎</button>
        <button id="touch-skill" aria-label="Способность">✦</button>
        <button id="touch-dash" aria-label="Рывок">➤</button>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
